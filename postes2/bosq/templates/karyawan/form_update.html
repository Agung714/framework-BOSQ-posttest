{% csrf_token %}
<!-- Nama Field -->
<div class="mb-3">
    <label for="id_nama" class="form-label">Nama</label>
    <input type="text" class="form-control" id="id_nama" name="nama" value="{{form.nama.value|default_if_none:'' }}" required>
    <div class="invalid-feedback">{{ form.nama.errors }}</div>
</div>
<!-- Jabatan Field -->
<div class="mb-3">
    <label for="id_jabatan" class="form-label">Jabatan</label>
    <input type="text" class="form-control" id="id_jabatan" name="jabatan" value="{{form.jabatan.value|default_if_none:'' }}" required>
    <div class="invalid-feedback">{{ form.jabatan.errors }}</div>
</div>
<!-- Email Field -->
<div class="mb-3">
    <label for="id_email" class="form-label">Email</label>
    <input type="email" class="form-control" id="id_email" name="email" value="{{form.email.value|default_if_none:'' }}" required>
    <div class="invalid-feedback">{{ form.email.errors }}</div>
</div>
<!-- Gaji Field -->
<div class="mb-3">
    <label for="id_gaji" class="form-label">Gaji</label>
    <input type="number" class="form-control" id="id_gaji" name="gaji" value="{{form.gaji.value|default_if_none:'' }}" required>
    <div class="invalid-feedback">{{ form.year.errors }}</div>
</div>

<button type="submit" class="btn btn-primary">Simpan</button>
